name: Tests

on:
  push:
    branches: [ '**' ]

env:
  # Increase this value to reset cache when MAGMA_URL changes.
  MAGMA_CACHE_NUMBER: 2.30-1

jobs:

  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v2

      - name: Guard against duplicate test basenames
        run: sh scripts/no_dup_test_basenames.sh

      - id: set-matrix
        run: |
          matrix=$(find Tests examples -maxdepth 1 -type f -name '*.m' ! -name '_*' | sort | jq -R . | jq -sc '{target: .}')
          echo $matrix
          echo $matrix | jq .
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  check-matrix:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - name: Install json2yaml
        run: |
          sudo npm install -g json2yaml

      - name: Check matrix definition
        run: |
          matrix='${{needs.matrix.outputs.matrix}}'
          echo $matrix
          echo $matrix | jq .
          echo $matrix | json2yaml

  has_access:
    runs-on: ubuntu-latest
    outputs:
      has_access: ${{ steps.my-key.outputs.has_access }}

    steps:
      - id: my-key
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        if: "${{ env.MAGMA_URL != '' }}"
        run: |
          echo "has_access=true" >> $GITHUB_OUTPUT

  check-has_access:
    runs-on: ubuntu-latest
    needs: has_access
    steps:
      - name: Check has_access definition
        run: |
          echo ${{needs.has_access.outputs.has_access}}



  prime-magma:
    runs-on: ubuntu-latest
    needs: has_access
    if: needs.has_access.outputs.has_access == 'true'
    steps:
      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        with:
          path: |
            ./magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            wget "$MAGMA_URL" -O magma.tar.gz --quiet && break
            echo "download attempt $i failed; retrying"; sleep 15
          done
          tar xf magma.tar.gz
          test -x ./magma/magma   # Reject an incomplete download before caching it.

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./magma/magma -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo | ./magma/magma

  printjob:
    name: print event
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: dump github context
        env:
          github_context: ${{ tojson(github) }}
        run: |
          echo "$github_context"



  test:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [has_access, matrix, prime-magma]
    if: needs.has_access.outputs.has_access == 'true'
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        with:
          path: |
            ./magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          wget "$MAGMA_URL" -O magma.tar.gz --quiet
          tar xf magma.tar.gz

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./magma/magma -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo | ./magma/magma

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts/test-tmp
          export MAGMA="$PWD/magma/magma"
          export MAGMA_TEMP_DIR="$PWD/artifacts/test-tmp"
          "$MAGMA" -b target:=${{matrix.target}} exitsignal:="" run_tests.m
