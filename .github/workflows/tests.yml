name: Tests

on:
  push:
    branches: [ '**' ]

env:
  # Increase this value to reset cache when MAGMA_URL changes.
  MAGMA_CACHE_NUMBER: 2.30-1-native-layout

jobs:

  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v2

      - name: Guard against duplicate test basenames
        run: sh scripts/no_dup_test_basenames.sh

      - id: set-matrix
        run: |
          matrix=$(find tests examples -maxdepth 1 -type f -name '*.m' ! -name '_*' | sort | jq -R . | jq -sc '{target: .}')
          echo $matrix
          echo $matrix | jq .
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  has_access:
    runs-on: ubuntu-latest
    outputs:
      has_access: ${{ steps.my-key.outputs.has_access }}

    steps:
      - id: my-key
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        if: "${{ env.MAGMA_URL != '' }}"
        run: |
          echo "has_access=true" >> $GITHUB_OUTPUT

  prime-magma:
    runs-on: ubuntu-latest
    needs: has_access
    if: needs.has_access.outputs.has_access == 'true'
    steps:
      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        with:
          path: |
            ./artifacts/magma-install/magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            wget "$MAGMA_URL" -O magma.tar.gz --quiet && break
            echo "download attempt $i failed; retrying"; sleep 15
          done
          mkdir -p artifacts/magma-install
          tar xf magma.tar.gz -C artifacts/magma-install
          test -x ./artifacts/magma-install/magma/magma   # Reject an incomplete download before caching it.

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./artifacts/magma-install/magma/magma -bn -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo 'SetQuitOnError(true); quit;' | ./artifacts/magma-install/magma/magma -bn

  test:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [has_access, matrix, prime-magma]
    if: needs.has_access.outputs.has_access == 'true'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          lfs: ${{ matrix.target == 'tests/native_tables_magma.m' }}

      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        with:
          path: |
            ./artifacts/magma-install/magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          wget "$MAGMA_URL" -O magma.tar.gz --quiet
          mkdir -p artifacts/magma-install
          tar xf magma.tar.gz -C artifacts/magma-install

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./artifacts/magma-install/magma/magma -bn -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo 'SetQuitOnError(true); quit;' | ./artifacts/magma-install/magma/magma -bn

      - name: Install native build dependencies
        if: startsWith(matrix.target, 'tests/native_')
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 libntl-dev libgmp-dev libflint-dev libboost-dev

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts/test-tmp
          export MAGMA="$PWD/artifacts/magma-install/magma/magma"
          export MAGMA_TEMP_DIR="$PWD/artifacts/test-tmp"
          "$MAGMA" -bn filename:=${{matrix.target}} run_tests.m

