name: Tests

on:
  push:
    branches: [ '**' ]

env:
  # Increase this value to reset cache when MAGMA_URL changes.
  MAGMA_CACHE_NUMBER: 2.30-1-native-layout

jobs:

  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: false

      - name: Guard against duplicate test basenames
        run: python3 tests/list_tests.py > /dev/null

      - id: set-matrix
        run: |
          matrix=$(python3 tests/list_tests.py | jq -R . | jq -sc '{target: .}')
          echo $matrix
          echo $matrix | jq .
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  has_access:
    runs-on: ubuntu-latest
    outputs:
      has_access: ${{ steps.my-key.outputs.has_access }}

    steps:
      - id: my-key
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        if: "${{ env.MAGMA_URL != '' }}"
        run: |
          echo "has_access=true" >> $GITHUB_OUTPUT

  prime-magma:
    runs-on: ubuntu-latest
    needs: has_access
    if: needs.has_access.outputs.has_access == 'true'
    steps:
      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        with:
          path: |
            ./artifacts/magma-install/magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          wget --tries=3 --wait=15 --waitretry=0 --retry-connrefused --retry-on-host-error \
            --retry-on-http-error=429,500,502,503 "$MAGMA_URL" -O magma.tar.gz --quiet
          mkdir -p artifacts/magma-install
          tar xf magma.tar.gz -C artifacts/magma-install
          test -x ./artifacts/magma-install/magma/magma   # Reject an incomplete download before caching it.

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./artifacts/magma-install/magma/magma -bn -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo 'SetQuitOnError(true); quit;' | ./artifacts/magma-install/magma/magma -bn

  test:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [has_access, matrix, prime-magma]
    if: needs.has_access.outputs.has_access == 'true'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          lfs: false

      - name: Fetch published F_2 sample
        if: matrix.target == 'tests/published_f2.m'
        run: git lfs pull --include='tests/fixtures/published-f2/sample.csv' --exclude=''

      - name: Fetch archived orbit summaries
        if: matrix.target == 'tests/archive_fixtures.m' || matrix.target == 'tests/archive_invariants.m'
        run: git lfs pull --include='tests/fixtures/oldcode-archive/summaries.tsv' --exclude=''

      - name: Fetch trace-table fixtures
        if: matrix.target == 'tests/native_tables_magma.m'
        run: git lfs pull --include='tests/fixtures/trace_tables/*.txt' --exclude=''

      - name: Fetch published F_2 census
        if: matrix.target == 'tests/compare/native_full_f2.m'
        run: git lfs pull --include='tests/fixtures/full_f2/census.csv.zip' --exclude=''

      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        with:
          path: |
            ./artifacts/magma-install/magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          wget "$MAGMA_URL" -O magma.tar.gz --quiet
          mkdir -p artifacts/magma-install
          tar xf magma.tar.gz -C artifacts/magma-install

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./artifacts/magma-install/magma/magma -bn -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo 'SetQuitOnError(true); quit;' | ./artifacts/magma-install/magma/magma -bn

      - name: Install native build dependencies
        if: startsWith(matrix.target, 'tests/native/') || startsWith(matrix.target, 'tests/compare/')
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 parallel libntl-dev libflint-dev libgmp-dev libzstd-dev zstd

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts/test-tmp
          export MAGMA="$PWD/artifacts/magma-install/magma/magma"
          export MAGMA_TEMP_DIR="$PWD/artifacts/test-tmp"
          "$MAGMA" -bn filename:=${{matrix.target}} tests/run_tests.m

      - name: Save full F_2 comparison evidence
        if: always() && matrix.target == 'tests/compare/native_full_f2.m'
        uses: actions/upload-artifact@v4
        with:
          name: native-full-f2
          path: |
            artifacts/full-f2/summary.json
            artifacts/full-f2/unmatched-*.csv
            artifacts/full-f2/disagreements.csv
            artifacts/full-f2/matches.csv
            artifacts/full-f2/*.log
